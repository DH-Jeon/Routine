<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- 시스템 다크모드 연동: 폼 컨트롤 등 기본 UI 색도 함께 전환 -->
  <meta name="color-scheme" content="light dark" />

  <!-- 아이폰 홈화면 아이콘 (180x180 PNG) -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <!-- 홈화면에서 실행 시 주소창 없이 전체화면 앱처럼 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="루틴" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>루틴 시간표</title>
  <style>
    /* Pretendard 가변 폰트 (오프라인 자체 포함) */
    @font-face {
      font-family: 'Pretendard Variable';
      font-weight: 45 920;
      font-style: normal;
      font-display: swap;
      src: url('fonts/PretendardVariable.woff2') format('woff2');
    }

    /* ============================================================
       디자인 토큰 (색/그림자 등). 색을 바꾸고 싶으면 여기만 수정하면
       앱 전체에 반영된다. 다크모드 값은 아래 prefers-color-scheme 참고.
       ============================================================ */
    :root {
      color-scheme: light dark;

      --bg: #f2f2f7;            /* 전체 배경 */
      --surface: #ffffff;       /* 카드·시트·시간표 패널 */
      --surface-2: #f7f7fa;     /* 입력창 배경 */
      --text: #1c1c1e;          /* 기본 글자색 */
      --text-muted: #8e8e93;    /* 보조 글자색(시간 숫자·안내문) */
      --on-pastel: #1c1c1e;     /* 파스텔 칸 위 활동 이름 (밝은 배경이라 항상 진하게) */
      --border: #d1d1d6;        /* 입력창 테두리 */
      --separator: #e0e0e5;     /* 영역 경계선·원 외곽선 */
      --sector-empty: #ededf2;  /* 빈 시간 칸 색 */
      --accent: #ff6a00;        /* 강조색(버튼·포커스) */
      --danger: #ff3b30;        /* 삭제 배경 */
      --weekend: #007aff;       /* 달력 토요일 */
      --done: #34c759;          /* 완료 체크 */
      --done-text: #b0b0b5;     /* 완료된 할 일 글자 */
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);   /* 카드 그림자 */
      --shadow-btn: 0 2px 8px rgba(255, 106, 0, 0.3);
    }

    /* 시스템이 다크모드일 때 토큰만 덮어쓴다 */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --surface: #1c1c1e;
        --surface-2: #2c2c2e;
        --text: #f2f2f7;
        --text-muted: #8e8e93;
        --on-pastel: #1c1c1e;
        --border: #3a3a3c;
        --separator: #3a3a3c;
        --sector-empty: #2c2c2e;
        --accent: #ff7a1a;
        --danger: #ff453a;
        --weekend: #0a84ff;
        --done: #30d158;
        --done-text: #6e6e73;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        --shadow-btn: 0 2px 8px rgba(255, 122, 26, 0.4);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* 터치 시 깜빡이는 하이라이트 제거 */
    }

    html, body {
      height: 100%;
    }

    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
      touch-action: manipulation; /* 더블 탭 확대 방지 */
    }

    /* 위/아래 절반씩 나누는 패널 공통 */
    .panel {
      height: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* 위쪽: 시간표 영역 (고정) */
    .schedule {
      flex: none;
      flex-direction: column; /* 요일 탭 + 시계를 세로로 */
      background: var(--surface);
      border-bottom: 1px solid var(--separator);
    }

    /* 요일 탭 + 복사 버튼을 한 줄에 배치 (시계 높이를 빼앗지 않음) */
    .schedule-top {
      display: flex;
      align-items: stretch;
      gap: 6px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 12px;
    }

    /* 요일 선택 탭 (월~일) */
    .day-tabs {
      flex: 1;
      min-width: 0;
      display: flex;
      gap: 4px;
    }
    .day-tab {
      flex: 1;
      padding: 7px 0;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .day-tab.active {
      background: var(--accent);
      color: #fff;
    }

    /* 현재 요일을 다른 요일로 복사하는 버튼 (요일 탭 오른쪽) */
    .copy-day-btn {
      flex: none;
      white-space: nowrap;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text-muted);
      cursor: pointer;
    }
    .copy-day-btn:active {
      filter: brightness(0.95);
    }

    /* 현재 요일 시간표를 초기화하는 버튼 (복사 버튼 오른쪽) */
    .clear-day-btn {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text-muted);
      cursor: pointer;
    }
    .clear-day-btn:active {
      filter: brightness(0.95);
    }

    /* 복사 대상 요일 선택 칩 */
    .day-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }
    .day-chip {
      min-width: 44px;
      min-height: 44px;
      padding: 0 14px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
    }
    .day-chip.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* 정사각형 비율로 남은 영역 가운데 꽉 차게 */
    .clock-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clock {
      width: 100%;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 1 / 1; /* 확대/회전에도 항상 정사각형 유지 */
      display: block;
      touch-action: none; /* 길게 눌러 드래그로 범위 선택할 때 페이지 스크롤이 제스처를 끊지 않게 */
      /* 삼성 등 안드로이드에서 길게 누를 때 텍스트 선택·컨텍스트 메뉴가 떠
         제스처가 끊기는 것 방지 */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    /* SVG <text>는 부모(.clock)의 user-select를 상속하지 않는 브라우저가 있어
       꾹 눌러 드래그할 때 시간 숫자가 선택된다. 텍스트에 직접 막는다. */
    .clock text {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .sector {
      stroke: none;
      cursor: pointer;
      transition: filter 0.12s ease;
    }
    .sector.empty {
      fill: var(--sector-empty); /* 빈 칸은 데이터 색 대신 토큰으로 (다크모드 대응) */
      /* 인접한 빈 칸 사이의 안티앨리어싱 잔금을 같은 색 테두리로 메운다 */
      stroke: var(--sector-empty);
      stroke-width: 0.5;
    }
    .sector:active {
      filter: brightness(0.92);
    }
    /* 길게 눌러 드래그하는 동안 선택된 칸 강조 */
    .sector.sel {
      stroke: var(--accent);
      stroke-width: 1.4;
      filter: brightness(1.06);
    }

    /* 칸 사이 구분선 (다른 활동일 때만 그림). 패널색과 같아 자연스럽게 나뉜다 */
    .divider {
      stroke: var(--surface);
      stroke-width: 0.7;
      stroke-linecap: round;
    }
    .clock-outline {
      fill: none;
      stroke: var(--separator);
      stroke-width: 0.7;
    }

    .hour-num {
      fill: var(--text-muted);
      font-size: 4.2px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    /* 현재 시각 마커 (링 바깥 작은 삼각형) */
    .now-marker {
      fill: var(--accent);
      pointer-events: none;
    }

    .sector-label {
      fill: var(--on-pastel);
      font-size: 3.4px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    /* ---------- 활동 입력 하단 시트 ---------- */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      z-index: 10;
    }
    .backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--surface);
      border-radius: 18px 18px 0 0;
      /* 좌우/하단 safe-area(노치·홈바) 만큼 여백 확보 */
      padding: 22px max(20px, env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.18);
      transform: translateY(110%);
      transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 11;
      max-width: 520px;
      margin: 0 auto;
      /* 짧은 화면(가로 모드·키보드 노출)에서도 버튼이 가려지지 않게 내부 스크롤 */
      max-height: 90dvh;
      overflow-y: auto;
    }
    .sheet.open {
      transform: translateY(0);
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .sheet-input {
      width: 100%;
      font-size: 16px; /* 16px 미만이면 iOS에서 포커스 시 화면이 확대됨 → 16px 유지 */
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      outline: none;
      margin-bottom: 18px;
    }
    .sheet-input:focus {
      border-color: var(--accent);
    }

    /* 할 일 시트의 날짜 선택 (− 8월 14일 (금) +) */
    .date-stepper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .date-step-btn {
      flex: none;
      width: 44px;
      height: 44px;
      font-size: 22px;
      font-weight: 600;
      line-height: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
    }
    .date-step-btn:active {
      filter: brightness(0.95);
    }
    .date-step-label {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
    }

    /* ---------- 달력 시트 ---------- */
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .cal-nav {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .cal-arrow {
      flex: none;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }
    .cal-arrow:active {
      background: var(--surface-2);
    }
    .cal-title {
      font-size: 17px;
      font-weight: 700;
      min-width: 92px;
      text-align: center;
    }
    /* 표시 모드 이름 (완료 개수 ↔ 완료 비율) */
    .cal-mode-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 58px;
      text-align: center;
    }

    .cal-weekdays,
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .cal-weekday {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 4px 0 6px;
    }
    .cal-weekday.sun { color: var(--danger); }
    .cal-weekday.sat { color: var(--weekend); }

    .cal-grid {
      margin-bottom: 18px;
    }
    .cal-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      padding: 3px 0;
      border: none;
      background: transparent;
      font-family: inherit;
      cursor: pointer;
    }
    /* 앞뒤 달 날짜는 흐리게 */
    .cal-cell.out {
      opacity: 0.32;
    }
    /* 날짜 숫자 — 완료 개수 모드에서 이 원에 빨간 반투명 배경이 깔린다 */
    .cal-num {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .cal-cell.sun .cal-num { color: var(--danger); }
    .cal-cell.sat .cal-num { color: var(--weekend); }
    .cal-cell.today .cal-num {
      box-shadow: inset 0 0 0 2px var(--accent);
      font-weight: 800;
    }
    /* 완료 비율(2/3) 자리 — 두 모드에서 칸 높이가 흔들리지 않게 항상 확보 */
    .cal-sub {
      height: 12px;
      line-height: 12px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .palette {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }
    /* 색 스와치 — 손가락으로 누르기 쉽게 44px 터치 영역 확보 */
    .swatch {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .swatch.selected {
      border-color: var(--text);
      transform: scale(1.08);
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      min-height: 50px; /* 누르기 편한 높이 */
      font-size: 16px;
      font-weight: 600;
      padding: 13px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .btn-cancel {
      background: var(--surface-2);
      color: var(--text);
    }
    .btn-save {
      background: var(--accent);
      color: #fff;
    }

    /* ---------- 아래쪽: 할 일 영역 (영역 안에서만 스크롤) ---------- */
    .tasks {
      flex: none;
      overflow-y: auto;
      overscroll-behavior: contain; /* 끝까지 스크롤해도 바깥(페이지)으로 튀지 않게 */
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
      display: block;
      padding: 0;
    }

    /* 스크롤해도 항상 위에 보이는 헤더 */
    .tasks-header {
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 12px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
      z-index: 2;
    }

    /* 할 일 추가 버튼 + 달력 버튼 한 줄 */
    .tasks-actions {
      display: flex;
      gap: 8px;
    }

    .add-btn {
      flex: 1;
      min-height: 52px;
      font-size: 16px;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
    }
    .add-btn:active {
      filter: brightness(0.95);
    }

    /* 달력 열기 버튼 (할 일 추가 오른쪽) */
    .cal-btn {
      flex: none;
      width: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .cal-btn:active {
      filter: brightness(0.95);
    }

    .add-input-wrap {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .add-input-wrap[hidden] {
      display: none;
    }
    .add-input {
      flex: 1;
      font-size: 16px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }
    .add-input:focus {
      border-color: var(--accent);
    }

    .todo-list {
      padding: 4px max(12px, env(safe-area-inset-right)) 20px max(12px, env(safe-area-inset-left));
    }

    .todo-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
    }

    /* 뒤에 깔리는 빨간 삭제 배경 — 스와이프 중에만 표시 (스크롤 시 가장자리 비침 방지) */
    .todo-delete-bg {
      position: absolute;
      inset: 0;
      background: var(--danger);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 22px;
      visibility: hidden;
    }
    .todo-item.swiping .todo-delete-bg {
      visibility: visible;
    }

    /* 스와이프로 움직이는 전경 */
    .todo-content {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px; /* 누르기 편한 행 높이 */
      background: var(--surface);
      padding: 14px;
      touch-action: pan-y; /* 세로 스크롤은 허용, 가로 스와이프는 JS가 처리 */
      will-change: transform;
      transform: translateX(0);
    }

    /* 완료 체크 — 28px 원, 충분한 터치 영역 */
    .todo-check {
      flex: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .todo-check svg {
      width: 16px;
      height: 16px;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .todo-text {
      flex: 1;
      font-size: 16px;
      line-height: 1.35;
      word-break: break-word;
      cursor: pointer; /* 눌러서 수정 */
    }

    /* 날짜 소제목 — 같은 날짜의 할 일들을 묶는다 */
    .todo-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 4px 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      /* 스티키 헤더(추가·달력 버튼 줄)에 가리지 않게 스크롤 시 여백 확보 */
      scroll-margin-top: 80px;
      transition: color 0.2s ease;
    }
    .todo-group:first-child {
      padding-top: 4px;
    }
    .todo-group .today-badge {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      padding: 2px 7px;
      border-radius: 999px;
    }
    /* 달력에서 날짜를 눌러 이동했을 때 잠깐 강조 */
    .todo-group.flash {
      color: var(--accent);
    }

    /* 완료 상태: 초록 체크 + 취소선 + 흐리게 */
    .todo-item.done .todo-check {
      background: var(--done);
      border-color: var(--done);
    }
    .todo-item.done .todo-check svg {
      opacity: 1;
    }
    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: var(--done-text);
    }

    /* 스와이프 삭제 시 높이 줄이며 사라지는 전환 */
    .todo-item.removing {
      transition: height 0.25s ease, margin 0.25s ease, opacity 0.25s ease;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 15px;
      padding: 32px 16px;
    }

    /* ============================================================
       가로 화면(landscape): 위/아래 대신 좌/우로 배치해 시간표가
       찌그러지지 않게 한다. 세로 화면은 위 기본 레이아웃 그대로.
       ============================================================ */
    @media (orientation: landscape) {
      body {
        flex-direction: row;
      }
      .panel {
        height: 100%;
        width: 50%;
      }
      .schedule {
        border-bottom: none;
        border-right: 1px solid var(--separator);
      }
    }
  </style>
</head>
<body>
  <section class="panel schedule">
    <div class="schedule-top">
      <div class="day-tabs" id="dayTabs"></div>
      <button class="copy-day-btn" id="copyDayBtn">복사</button>
      <button class="clear-day-btn" id="clearDayBtn" aria-label="요일 초기화">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M8 6V4h8v2m1 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m4 4v6m6-6v6"/>
        </svg>
      </button>
    </div>
    <div class="clock-wrap">
      <svg class="clock" viewBox="0 0 100 100" id="clock"></svg>
    </div>
  </section>

  <section class="panel tasks">
    <div class="tasks-header">
      <div class="tasks-actions">
        <button class="add-btn" id="addBtn">+ 할 일 추가</button>
        <button class="cal-btn" id="calBtn" aria-label="달력 보기">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="todo-list" id="todoList"></div>
  </section>

  <!-- 활동 입력 하단 시트 -->
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-title" id="sheetTitle">00시 활동</div>
    <input class="sheet-input" id="sheetInput" type="text" placeholder="활동 이름 (비우면 삭제)" maxlength="12" />
    <div class="palette" id="palette"></div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="btnCancel">취소</button>
      <button class="btn btn-save" id="btnSave">저장</button>
    </div>
  </div>

  <!-- 할 일 추가 하단 시트 -->
  <div class="sheet" id="todoSheet">
    <div class="sheet-title" id="todoSheetTitle">할 일 추가</div>
    <div class="date-stepper">
      <button class="date-step-btn" id="todoDatePrev" aria-label="하루 전">−</button>
      <div class="date-step-label" id="todoDateLabel">날짜</div>
      <button class="date-step-btn" id="todoDateNext" aria-label="하루 후">+</button>
    </div>
    <input class="sheet-input" id="todoInput" type="text" placeholder="할 일을 입력하세요" maxlength="60" />
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="btnTodoCancel">취소</button>
      <button class="btn btn-save" id="btnTodoAdd">추가</button>
    </div>
  </div>

  <!-- 할 일 달력 하단 시트 -->
  <div class="sheet" id="calSheet">
    <div class="cal-head">
      <div class="cal-nav">
        <button class="cal-arrow" id="calPrevMonth" aria-label="이전 달">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="cal-title" id="calTitle">달력</div>
        <button class="cal-arrow" id="calNextMonth" aria-label="다음 달">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="cal-nav">
        <button class="cal-arrow" id="calPrevMode" aria-label="이전 표시 방식">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="cal-mode-name" id="calModeName">완료 개수</div>
        <button class="cal-arrow" id="calNextMode" aria-label="다음 표시 방식">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>
    <div class="cal-weekdays" id="calWeekdays"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="btnCalClose">닫기</button>
    </div>
  </div>

  <!-- 요일 복사 하단 시트 -->
  <div class="sheet" id="copySheet">
    <div class="sheet-title" id="copyTitle">어디에 복사할까요?</div>
    <div class="day-chips" id="copyChips"></div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="btnCopyCancel">취소</button>
      <button class="btn btn-save" id="btnCopyApply">붙여넣기</button>
    </div>
  </div>

  <!-- 요일 초기화 확인 하단 시트 -->
  <div class="sheet" id="clearSheet">
    <div class="sheet-title" id="clearTitle">시간표를 초기화할까요?</div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="btnClearCancel">취소</button>
      <button class="btn btn-save" id="btnClearConfirm">초기화</button>
    </div>
  </div>

  <script>
    // 요일별(월~일) 24시간 데이터. schedules[요일][시] 형태로 보관한다.
    const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
    function emptyDay() {
      return Array.from({ length: 24 }, (_, hour) => ({ hour, label: '', color: '#eeeeee' }));
    }
    const schedules = Array.from({ length: 7 }, emptyDay);
    // 오늘 요일을 기본 선택 (getDay: 0=일 → 월=0 기준으로 변환)
    const TODAY = (new Date().getDay() + 6) % 7; // 고정된 오늘 요일 (현재 시각 마커용)
    let currentDay = TODAY;
    // 현재 보고 있는 요일의 배열 (render/openSheet 등이 이 변수를 기준으로 동작)
    let schedule = schedules[currentDay];

    // ----- localStorage 저장/복원 -----
    const STORAGE_SCHEDULES = 'routine.schedules';
    const STORAGE_SCHEDULE_OLD = 'routine.schedule'; // 예전 단일 시간표 (마이그레이션용)
    const STORAGE_TODOS = 'routine.todos';

    function saveSchedule() {
      try { localStorage.setItem(STORAGE_SCHEDULES, JSON.stringify(schedules)); } catch (e) {}
    }
    function applyDayData(target, data) {
      if (!Array.isArray(data)) return;
      data.forEach(it => {
        if (it && it.hour >= 0 && it.hour < 24) {
          target[it.hour] = { hour: it.hour, label: it.label || '', color: it.color || '#eeeeee' };
        }
      });
    }
    function loadSchedule() {
      try {
        const raw = localStorage.getItem(STORAGE_SCHEDULES);
        if (raw) {
          const data = JSON.parse(raw);
          if (Array.isArray(data)) {
            data.forEach((day, di) => { if (di < 7) applyDayData(schedules[di], day); });
          }
          return;
        }
        // 예전 단일 시간표가 있으면 모든 요일에 복사 (기존 사용자 데이터 보존)
        const old = localStorage.getItem(STORAGE_SCHEDULE_OLD);
        if (old) {
          const data = JSON.parse(old);
          for (let di = 0; di < 7; di++) applyDayData(schedules[di], data);
          // 새 형식으로 옮긴 뒤 예전 키 제거
          saveSchedule();
          localStorage.removeItem(STORAGE_SCHEDULE_OLD);
        }
      } catch (e) {}
    }
    loadSchedule();

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const CX = 50;
    const CY = 50;
    const R_OUTER = 42;   // 칸 바깥 반지름
    const R_LABEL = 46.5; // 시간 숫자 위치
    const R_TEXT = 30;    // 칸 안 활동 이름 위치
    const STEP = 15;      // 한 칸 = 15도

    // 각도(정북 기준 시계방향, 도) → 좌표. 0도 = 12시 방향(위)
    function polar(angleDeg, radius) {
      const rad = (angleDeg - 90) * Math.PI / 180;
      return {
        x: CX + radius * Math.cos(rad),
        y: CY + radius * Math.sin(rad)
      };
    }

    // hour 칸의 부채꼴 path (중심 → 시작 외곽 → 호 → 중심)
    function sectorPath(hour) {
      const start = hour * STEP;
      const end = start + STEP;
      const p1 = polar(start, R_OUTER);
      const p2 = polar(end, R_OUTER);
      return `M ${CX} ${CY} L ${p1.x} ${p1.y} A ${R_OUTER} ${R_OUTER} 0 0 1 ${p2.x} ${p2.y} Z`;
    }

    // 연속으로 같은 활동(label+color)인 칸들을 한 묶음(run)으로 그룹화. 0시↔23시 경계도 연결.
    function getRuns() {
      const runs = [];
      schedule.forEach(item => {
        const last = runs[runs.length - 1];
        const sameAsLast = last && item.label && last.label === item.label &&
          last.color === item.color && last.hours[last.hours.length - 1] === item.hour - 1;
        if (sameAsLast) {
          last.hours.push(item.hour);
        } else {
          runs.push({ label: item.label, color: item.color, hours: [item.hour] });
        }
      });
      // 자정 경계 묶기 (23시와 0시가 같은 활동이면 연결)
      if (runs.length > 1) {
        const first = runs[0];
        const last = runs[runs.length - 1];
        if (first.label && first.label === last.label && first.color === last.color &&
          first.hours[0] === 0 && last.hours[last.hours.length - 1] === 23) {
          last.hours = last.hours.concat(first.hours);
          runs.shift();
        }
      }
      return runs;
    }

    // 두 칸이 이어지는지 (경계 구분선 생략 여부)
    function continuous(hourA, hourB) {
      const a = schedule[hourA], b = schedule[hourB];
      if (!a.label && !b.label) return true; // 빈 칸끼리는 잔금 없이 합친다
      return !!a.label && a.label === b.label && a.color === b.color;
    }

    // 길게 눌러 드래그하는 동안의 선택 범위 (null이면 선택 중 아님)
    let selRange = null; // { start, end, dir }  dir: +1 시계방향, -1 반시계
    let brush = null;          // 드래그로 칠할 활동 { label, color }
    let scheduleBackup = null; // 드래그 시작 시점 스냅샷 (취소·재계산용)
    // 드래그로 선택된 시간들을 누른 방향(시계/반시계)대로 반환. 자정(23↔0)도 넘는다.
    function selectedHourList() {
      if (!selRange) return [];
      const { start, end } = selRange;
      const dir = selRange.dir || 1;
      const list = [];
      for (let k = 0; k < 24; k++) {
        const h = (start + dir * k + 24) % 24;
        list.push(h);
        if (h === end) break;
      }
      return list;
    }
    function selectedHours() {
      return new Set(selectedHourList());
    }
    // 시작 칸의 활동(brush)을 현재 드래그 경로의 칸들에 칠한다.
    // 매번 시작 시점 스냅샷에서 복원 후 다시 칠해, 드래그를 줄였다 늘렸다 해도 정확하다.
    function paintSelection() {
      if (!brush || !scheduleBackup) return;
      for (let h = 0; h < 24; h++) schedule[h] = { ...scheduleBackup[h] };
      for (const h of selectedHourList()) {
        schedule[h] = { hour: h, label: brush.label, color: brush.color };
      }
    }

    function render() {
      const svg = document.getElementById('clock');
      svg.innerHTML = '';

      // 길게 눌러 드래그하는 동안 선택된 시간 범위 (없으면 빈 Set)
      const selHours = selectedHours();

      // 1) 부채꼴 칸 (색칠 + 클릭 영역). 클릭/드래그는 SVG에 위임(setupClockGestures)
      schedule.forEach(item => {
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', sectorPath(item.hour));
        path.dataset.hour = item.hour;
        let cls = item.label ? 'sector' : 'sector empty';
        if (selHours.has(item.hour)) cls += ' sel';
        // 활동이 있으면 데이터의 파스텔 색으로, 빈 칸은 .empty 클래스로(CSS 토큰)
        if (item.label) path.setAttribute('fill', item.color);
        path.setAttribute('class', cls);
        svg.appendChild(path);
      });

      // 2) 칸 사이 구분선 (이어지는 활동이면 생략)
      for (let h = 0; h < 24; h++) {
        const next = (h + 1) % 24;
        if (continuous(h, next)) continue;
        const angle = next * STEP; // h와 next 사이 경계
        const inner = polar(angle, 0);
        const outer = polar(angle, R_OUTER);
        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('class', 'divider');
        line.setAttribute('x1', inner.x);
        line.setAttribute('y1', inner.y);
        line.setAttribute('x2', outer.x);
        line.setAttribute('y2', outer.y);
        svg.appendChild(line);
      }

      // 3) 바깥 원 외곽선
      const circle = document.createElementNS(SVG_NS, 'circle');
      circle.setAttribute('class', 'clock-outline');
      circle.setAttribute('cx', CX);
      circle.setAttribute('cy', CY);
      circle.setAttribute('r', R_OUTER);
      svg.appendChild(circle);

      // 4) 활동 이름 — 묶음(run)마다 가운데 한 번만 표시
      getRuns().forEach(run => {
        if (!run.label) return;
        const midAngle = run.hours[0] * STEP + (run.hours.length * STEP) / 2;
        const tp = polar(midAngle, R_TEXT);
        const text = document.createElementNS(SVG_NS, 'text');
        text.setAttribute('class', 'sector-label');
        text.setAttribute('x', tp.x);
        text.setAttribute('y', tp.y);
        text.setAttribute('fill', textColorFor(run.color));
        text.textContent = run.label;
        svg.appendChild(text);
        // 가로로 충분히 들어가면 그대로 두고, 좁아서 잘릴 경우만 방사형 세로 쌓기로 전환
        const maxW = run.hours.length * (2 * Math.PI * R_TEXT / 24) * 0.92;
        if (text.getComputedTextLength() > maxW && run.label.length > 1) {
          // 가로 텍스트 제거 후 중심→바깥 방향으로 글자 하나씩 세로 쌓기
          svg.removeChild(text);
          const fill = textColorFor(run.color);
          const STEP_R = 3.6;            // 글자 간격(폰트 3.4 + 여백)
          const R_IN = 14, R_OUT = R_OUTER - 3; // 글자가 놓일 반지름 밴드
          const maxChars = Math.floor((R_OUT - R_IN) / STEP_R) + 1;
          let chars = Array.from(run.label);
          if (chars.length > maxChars) chars = chars.slice(0, maxChars - 1).concat('…');
          const n = chars.length;
          // R_TEXT 기준 중앙 정렬하되 밴드 밖으로 나가지 않게 clamp
          let startR = R_TEXT - (n - 1) * STEP_R / 2;
          startR = Math.min(Math.max(startR, R_IN), R_OUT - (n - 1) * STEP_R);
          // 방사형으로 쌓으면 시계 위쪽/왼쪽 칸은 바깥 끝이 위(또는 왼쪽)라
          // 글자가 아래→위로 놓여 거꾸로 읽힌다. 바깥 끝이 읽기 시작점(더 위,
          // 수평이면 더 왼쪽)이면 순서를 뒤집어, 항상 위→아래(수평이면 왼→오)로
          // 읽히게 한다. 하단/오른쪽 칸은 그대로 둔다.
          const innerP = polar(midAngle, startR);
          const outerP = polar(midAngle, startR + (n - 1) * STEP_R);
          const outerIsStart = (outerP.y < innerP.y - 0.01) ||
            (Math.abs(outerP.y - innerP.y) <= 0.01 && outerP.x < innerP.x);
          const seq = outerIsStart ? chars.slice().reverse() : chars;
          seq.forEach((ch, i) => {
            const rp = polar(midAngle, startR + i * STEP_R);
            const ct = document.createElementNS(SVG_NS, 'text');
            ct.setAttribute('class', 'sector-label');
            ct.setAttribute('x', rp.x);
            ct.setAttribute('y', rp.y);
            ct.setAttribute('fill', fill);
            ct.textContent = ch;
            svg.appendChild(ct);
          });
        }
      });

      // 5) 바깥쪽 시간 숫자 (0~23) — 칸 가운데가 아니라 칸 경계선 위에 표시
      for (let h = 0; h < 24; h++) {
        const np = polar(h * STEP, R_LABEL);
        const num = document.createElementNS(SVG_NS, 'text');
        num.setAttribute('class', 'hour-num');
        num.setAttribute('x', np.x);
        num.setAttribute('y', np.y);
        num.textContent = h;
        svg.appendChild(num);
      }

      // 6) 현재 시각 마커 (오늘 요일 탭에서만)
      if (currentDay === TODAY) {
        const now = new Date();
        const angle = (now.getHours() + now.getMinutes() / 60) * STEP; // 0~360
        const tip = polar(angle, R_OUTER + 0.5);   // 안쪽(링)을 향하는 꼭짓점
        const b1 = polar(angle - 2.2, R_OUTER + 3.2);
        const b2 = polar(angle + 2.2, R_OUTER + 3.2);
        const tri = document.createElementNS(SVG_NS, 'path');
        tri.setAttribute('class', 'now-marker');
        tri.setAttribute('d', `M ${tip.x} ${tip.y} L ${b1.x} ${b1.y} L ${b2.x} ${b2.y} Z`);
        svg.appendChild(tri);
      }
    }

    /* ---------- 활동 입력 하단 시트 ---------- */
    const PALETTE = [
      // 파스텔 톤
      '#FFD6D6', '#FFE5C2', '#FFF3C2', '#E2F5C2',
      '#C2F0DA', '#C2E8F5', '#C2D4FF', '#D9C2FF',
      '#F2C2EE', '#F5C2D4',
      // 선명한 톤
      '#FF6B6B', '#FF9F43', '#FFD93D', '#6BCB77',
      '#4ECDC4', '#45AAF2', '#4B7BEC', '#A55EEA',
      '#EC5EBA', '#FC5C7D',
      // 진한 톤
      '#C0392B', '#E67E22', '#16A085', '#27AE60',
      '#2980B9', '#8E44AD', '#2C3E50', '#7F8C8D'
    ];

    // 배경색 밝기에 따라 글자색(검정/흰색)을 자동 선택
    function textColorFor(bg) {
      const m = /^#([0-9a-f]{6})$/i.exec(bg);
      if (!m) return '#1c1c1e';
      const n = parseInt(m[1], 16);
      const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      // 상대 휘도 (sRGB 근사)
      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
      return lum > 150 ? '#1c1c1e' : '#ffffff';
    }

    const backdrop = document.getElementById('backdrop');
    const sheet = document.getElementById('sheet');
    const sheetTitle = document.getElementById('sheetTitle');
    const sheetInput = document.getElementById('sheetInput');
    const paletteEl = document.getElementById('palette');

    let editHours = null; // 편집 중인 시간 배열 (단일이면 [h], 범위면 순서대로·자정 wrap 가능)
    let selectedColor = PALETTE[0];

    // 시트가 열린 시각. 삼성 등 안드로이드 브라우저는 터치 후 ~300ms 뒤에 같은
    // 좌표로 합성(ghost) click을 한 번 더 보내는데, 시계를 탭해 시트를 연 직후
    // 그 ghost click이 backdrop에 떨어져 시트가 즉시 닫히는 것을 막는 가드.
    let lastSheetOpen = 0;

    // 팔레트 스와치 생성
    PALETTE.forEach(color => {
      const sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = color;
      sw.dataset.color = color;
      sw.addEventListener('click', () => selectColor(color));
      paletteEl.appendChild(sw);
    });

    function selectColor(color) {
      selectedColor = color;
      paletteEl.querySelectorAll('.swatch').forEach(sw => {
        sw.classList.toggle('selected', sw.dataset.color === color);
      });
    }

    function openSheet(hours) {
      // hours: 선택된 시간 배열. 단일이면 [h], 범위면 누른 순서대로(자정 wrap 포함)
      if (!hours || !hours.length) return;
      editHours = hours.slice();
      const start = hours[0], end = hours[hours.length - 1];
      const item = schedule[start];
      const pad = h => String(h).padStart(2, '0');
      sheetTitle.textContent = hours.length === 1
        ? pad(start) + '시 활동'
        : pad(start) + '시–' + pad(end) + '시 활동';
      sheetInput.value = item.label;
      // 기존 색이 팔레트에 있으면 그 색, 없으면 첫 색 선택
      selectColor(PALETTE.includes(item.color) ? item.color : PALETTE[0]);
      lastSheetOpen = Date.now();
      backdrop.classList.add('open');
      sheet.classList.add('open');
      // 사용자 탭과 같은 동기 컨텍스트에서 바로 포커스해야 iOS가 키보드를 띄운다
      sheetInput.focus();
    }

    function closeSheet() {
      backdrop.classList.remove('open');
      sheet.classList.remove('open');
      editHours = null;
    }

    function saveSheet() {
      if (!editHours || !editHours.length) return;
      const label = sheetInput.value.trim();
      // 선택된 모든 시간에 같은 활동 적용 (비우면 회색 빈 칸으로 초기화)
      editHours.forEach(h => {
        schedule[h] = label === ''
          ? { hour: h, label: '', color: '#eeeeee' }
          : { hour: h, label, color: selectedColor };
      });
      saveSchedule();
      render();
      closeSheet();
    }

    document.getElementById('btnSave').addEventListener('click', saveSheet);
    document.getElementById('btnCancel').addEventListener('click', closeSheet);
    backdrop.addEventListener('click', () => {

      if (Date.now() - lastSheetOpen < 500) return;
      closeSheet(); closeTodoSheet(); closeCalSheet(); closeCopySheet(); closeClearSheet();

    /* ---------- 시계: 짧은 탭(단일) + 길게 눌러 드래그(범위 선택) ---------- */
    function setupClockGestures() {
      const svg = document.getElementById('clock');
      const LONG_MS = 700;     // 길게 누름 인식 시간(약 1초 내)
      const MOVE_CANCEL = 8;   // 길게 누름 전 이 거리(px)를 넘게 움직이면 취소
      let timer = null, startHour = null, downXY = null, active = false;

      function hourFromEvent(e) {
        const rect = svg.getBoundingClientRect();
        const sx = (e.clientX - rect.left) / rect.width * 100;
        const sy = (e.clientY - rect.top) / rect.height * 100;
        let deg = Math.atan2(sy - CY, sx - CX) * 180 / Math.PI + 90;
        deg = ((deg % 360) + 360) % 360;
        return Math.floor(deg / STEP) % 24;
      }
      // 파이(부채꼴) 안쪽을 눌렀는지 판정. 바깥 배경 탭으로 시트가 열리는 것 방지.
      function inClock(e) {
        const rect = svg.getBoundingClientRect();
        const sx = (e.clientX - rect.left) / rect.width * 100;
        const sy = (e.clientY - rect.top) / rect.height * 100;
        return Math.hypot(sx - CX, sy - CY) <= R_OUTER;
      }
      function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } }

      svg.addEventListener('pointerdown', e => {
        if (!inClock(e)) return; // 파이 바깥(배경) 탭은 무시
        startHour = hourFromEvent(e);
        downXY = { x: e.clientX, y: e.clientY };
        active = false;
        clearTimer();
        timer = setTimeout(() => {
          timer = null;
          // 빈 칸에서 시작하면 칠할 활동이 없으므로 무시
          const src = schedule[startHour];
          if (!src.label) return;
          // 길게 누름 성립 → 시작 칸의 활동을 드래그 경로에 칠하기 시작
          active = true;
          brush = { label: src.label, color: src.color };
          scheduleBackup = schedule.map(x => ({ ...x }));
          selRange = { start: startHour, end: startHour, dir: null };
          try { svg.setPointerCapture(e.pointerId); } catch (_) {}
          if (navigator.vibrate) navigator.vibrate(15);
          paintSelection();
          render();
        }, LONG_MS);
      });

      svg.addEventListener('pointermove', e => {
        if (active) {
          const h = hourFromEvent(e);
          // 첫 이동에서 시계/반시계 방향을 한 번 정한다 (자정 wrap 방향 결정)
          if (selRange.dir === null && h !== selRange.start) {
            const cw = (h - selRange.start + 24) % 24;   // 시계방향 거리
            const ccw = (selRange.start - h + 24) % 24;  // 반시계 거리
            selRange.dir = cw <= ccw ? 1 : -1;
          }
          selRange.end = h;
          paintSelection();
          render();
        } else if (downXY) {
          // 길게 누름 전 큰 움직임이면 제스처 취소(스크롤 등으로 간주)
          if (Math.abs(e.clientX - downXY.x) > MOVE_CANCEL ||
              Math.abs(e.clientY - downXY.y) > MOVE_CANCEL) {
            clearTimer();
            downXY = null;
          }
        }
      });

      svg.addEventListener('pointerup', e => {
        if (active) {
          // 칠하기 완료 → 이미 반영된 결과를 저장 확정
          selRange = null; brush = null; scheduleBackup = null;
          saveSchedule();
          render();
        } else if (timer && downXY) {
          // 짧은 탭 → 단일 칸 입력
          clearTimer();
          openSheet([hourFromEvent(e)]);
        }
        active = false; startHour = null; downXY = null;
      });

      function cancelGesture() {
        clearTimer();
        // 칠하던 중 취소 → 시작 시점 스냅샷으로 되돌린다
        if (active && scheduleBackup) {
          for (let h = 0; h < 24; h++) schedule[h] = { ...scheduleBackup[h] };
          render();
        }
        selRange = null; brush = null; scheduleBackup = null;
        active = false; startHour = null; downXY = null;
      }
      svg.addEventListener('pointercancel', cancelGesture);
      svg.addEventListener('pointerleave', () => { if (!active) { clearTimer(); downXY = null; } });
    }
    setupClockGestures();

    /* ---------- 요일 복사 ---------- */

    /* ---------- 요일 탭 ---------- */
    const dayTabs = document.getElementById('dayTabs');
    function renderDayTabs() {

    renderDayTabs();
    render();
    // 1분마다 현재 시각 마커 위치 갱신 (오늘 탭을 볼 때만)
    setInterval(() => { if (currentDay === TODAY) render(); }, 60000);

    /* ---------- 날짜 유틸 (할 일은 'YYYY-MM-DD' 로컬 날짜로 묶는다) ---------- */
    const WEEKDAY_KO = ['일', '월', '화', '수', '목', '금', '토'];
    const pad2 = n => String(n).padStart(2, '0');

    function dateKeyOf(d) {
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }
    function todayKey() {
      return dateKeyOf(new Date());
    }
    function parseKey(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d); // 로컬 기준 (UTC 파싱으로 하루 밀리는 것 방지)
    }
    function isDateKey(v) {
      return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
    }
    // 날짜를 delta일 만큼 이동 (월·연 경계는 Date가 알아서 넘긴다)
    function shiftKey(key, delta) {
      const d = parseKey(key);
      d.setDate(d.getDate() + delta);
      return dateKeyOf(d);
    }
    // "8월 14일 (금)"
    function formatDateFull(key) {
      const d = parseKey(key);
      return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEKDAY_KO[d.getDay()] + ')';
    }

    /* ---------- 할 일 목록 ---------- */
    const todos = []; // [{id, text, done, createdAt, date}]  date: 'YYYY-MM-DD'
    let todoSeq = 1;

    function saveTodos() {
      try { localStorage.setItem(STORAGE_TODOS, JSON.stringify(todos)); } catch (e) {}
    }
    function loadTodos() {
      try {
        const raw = localStorage.getItem(STORAGE_TODOS);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (!Array.isArray(data)) return;
        let fixed = false;
        data.forEach(t => {
          if (t && typeof t.text === 'string') {
            // 날짜가 없는(구버전) 항목은 추가한 날로 배정, 그것도 없으면 오늘
            let date = t.date;
            if (!isDateKey(date)) {
              date = t.createdAt ? dateKeyOf(new Date(t.createdAt)) : todayKey();
              fixed = true;
            }
            todos.push({ id: t.id, text: t.text, done: !!t.done, createdAt: t.createdAt, date });
          }
        });
        // 다음 id가 기존과 겹치지 않게
        todoSeq = todos.reduce((max, t) => Math.max(max, t.id || 0), 0) + 1;
        // id가 없는(구버전·손상) 항목에 새 id 부여 → 토글·삭제 가능하게
        todos.forEach(t => { if (t.id == null) { t.id = todoSeq++; fixed = true; } });
        if (fixed) saveTodos();
      } catch (e) {}
    }
    loadTodos();

    const addBtn = document.getElementById('addBtn');
    const todoSheet = document.getElementById('todoSheet');
    const todoInput = document.getElementById('todoInput');
    const todoList = document.getElementById('todoList');

    const todoSheetTitle = document.getElementById('todoSheetTitle');
    const btnTodoAdd = document.getElementById('btnTodoAdd');
    const todoDateLabel = document.getElementById('todoDateLabel');
    let editingTodoId = null; // null이면 추가 모드, 값이 있으면 그 항목 수정 모드
    let sheetDate = todayKey(); // 시트에서 지정 중인 날짜

    function setSheetDate(key) {
      sheetDate = key;
      todoDateLabel.textContent = formatDateFull(key);
    }

    function openTodoSheet(todo) {
      editingTodoId = todo ? todo.id : null;
      todoSheetTitle.textContent = todo ? '할 일 수정' : '할 일 추가';
      btnTodoAdd.textContent = todo ? '저장' : '추가';
      todoInput.value = todo ? todo.text : '';
      // 추가는 항상 오늘부터, 수정은 그 할 일의 날짜부터 시작
      setSheetDate(todo ? todo.date : todayKey());
      lastSheetOpen = Date.now();
      backdrop.classList.add('open');
      todoSheet.classList.add('open');
      // 사용자 탭과 같은 동기 컨텍스트에서 바로 포커스해야 iOS가 키보드를 띄운다
      todoInput.focus();
    }
    function closeTodoSheet() {
      backdrop.classList.remove('open');
      todoSheet.classList.remove('open');
    }

    document.getElementById('todoDatePrev').addEventListener('click', () => setSheetDate(shiftKey(sheetDate, -1)));
    document.getElementById('todoDateNext').addEventListener('click', () => setSheetDate(shiftKey(sheetDate, 1)));

    // 한 할 일의 카드 DOM 만들기 (스와이프 삭제까지 연결)
    function createTodoItem(todo) {
      const item = document.createElement('div');
      item.className = 'todo-item' + (todo.done ? ' done' : '');

      const bg = document.createElement('div');
      bg.className = 'todo-delete-bg';
      bg.textContent = '삭제';

      const content = document.createElement('div');
      content.className = 'todo-content';

      const check = document.createElement('div');
      check.className = 'todo-check';
      check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      check.addEventListener('click', () => toggleTodo(todo.id));

      const text = document.createElement('span');
      text.className = 'todo-text';
      text.textContent = todo.text;
      text.addEventListener('click', () => openTodoSheet(todo));

      content.appendChild(check);
      content.appendChild(text);
      item.appendChild(bg);
      item.appendChild(content);

      enableSwipe(item, content, todo.id);
      return item;
    }

    function renderTodos() {
      todoList.innerHTML = '';

      if (todos.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = '할 일을 추가해보세요';
        todoList.appendChild(empty);
        return;
      }

      // 날짜별로 묶어서 표시 (최신 날짜가 위, 그룹 안에서는 추가한 순서 그대로)
      const today = todayKey();
      const keys = [...new Set(todos.map(t => t.date))].sort().reverse();

      keys.forEach(key => {
        const head = document.createElement('div');
        head.className = 'todo-group';
        head.dataset.date = key;
        head.textContent = formatDateFull(key);
        if (key === today) {
          const badge = document.createElement('span');
          badge.className = 'today-badge';
          badge.textContent = '오늘';
          head.appendChild(badge);
        }
        todoList.appendChild(head);

        todos.forEach(todo => {
          if (todo.date === key) todoList.appendChild(createTodoItem(todo));
        });
      });
    }

    // 터치/마우스 스와이프 삭제 (Pointer 이벤트로 통합)
    function enableSwipe(item, content, id) {
      let startX = 0, startY = 0, dx = 0, width = 0, dragging = false, moved = false, axis = null;

      content.addEventListener('pointerdown', e => {
        dragging = true;
        moved = false;
        axis = null; // 아직 가로/세로 방향 미확정
        startX = e.clientX;
        startY = e.clientY;
        width = item.offsetWidth;
        content.style.transition = 'none';
        // 직전 복귀 애니메이션이 이 pointerdown으로 끊기면 transitionend가
        // 안 떠서 빨간 배경(swiping)이 남는다. 새 제스처 시작 시 한 번 정리하고,
        // 다시 가로 스와이프면 pointermove에서 도로 켠다.
        item.classList.remove('swiping');
      });

      content.addEventListener('pointermove', e => {
        if (!dragging) return;
        const mx = e.clientX - startX;
        const my = e.clientY - startY;
        // 첫 의미 있는 움직임으로 방향을 한 번만 결정 (축 잠금)
        if (axis === null) {
          if (Math.abs(mx) < 6 && Math.abs(my) < 6) return; // 너무 작은 떨림은 무시
          axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
          // 가로 스와이프로 확정된 경우에만 포인터를 캡처 + 빨간 배경 노출
          if (axis === 'x') {
            content.setPointerCapture(e.pointerId);
            item.classList.add('swiping');
          }
        }
        if (axis !== 'x') return; // 세로 스크롤이면 카드를 움직이지 않음 (빨간 배경 노출 방지)
        moved = true;
        dx = Math.min(0, mx); // 왼쪽으로만
        content.style.transform = 'translateX(' + dx + 'px)';
      });

      function endDrag() {
        if (!dragging) return;
        dragging = false;
        if (axis === 'x') {
          content.style.transition = 'transform 0.25s ease';
          if (Math.abs(dx) > width * 0.4) {
            removeItem(item, content, id);
          } else if (dx < 0) {
            content.style.transform = 'translateX(0)';
            // 원위치 애니메이션이 끝나면 빨간 배경을 다시 숨김
            content.addEventListener('transitionend', () => {
              item.classList.remove('swiping');
            }, { once: true });
          } else {
            // 실제 이동이 없었으면 즉시 숨김 (transition 미발생)
            item.classList.remove('swiping');
          }
        }
        dx = 0;
        axis = null;
      }

      content.addEventListener('pointerup', endDrag);
      content.addEventListener('pointercancel', endDrag);
      // 드래그 직후 발생하는 클릭으로 체크 토글되는 것 방지
      content.addEventListener('click', e => {
        if (moved) {
          e.stopPropagation();
          e.preventDefault();
        }
      }, true);
    }

    // 항목이 스르륵 사라지며 삭제
    function removeItem(item, content, id) {
      // 1) 데이터에서 먼저 제거 — 애니메이션 도중 다른 동작으로 목록이
      //    다시 그려져도 삭제한 항목이 되살아나지 않게 한다.
      const i = todos.findIndex(t => t.id === id);
      if (i === -1) return;
      const date = todos[i].date;
      todos.splice(i, 1);
      saveTodos();

      // 2) DOM 노드만 애니메이션 후 제거 (목록 전체를 다시 그리지 않음)
      const h = item.offsetHeight;
      content.style.transform = 'translateX(-100%)';
      item.style.height = h + 'px';
      item.offsetHeight; // 강제 리플로우
      item.classList.add('removing');
      item.style.height = '0px';
      item.style.marginBottom = '0px';
      item.style.opacity = '0';

      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        item.remove();
        // 그 날짜의 마지막 항목이었다면 빈 날짜 소제목이 남으므로 다시 그린다
        // (전체가 비었으면 안내문 표시)
        if (!todos.some(t => t.date === date)) renderTodos();
      };
      item.addEventListener('transitionend', e => {
        if (e.propertyName === 'height') done();
      }, { once: true });
      setTimeout(done, 350); // transitionend가 누락돼도 반드시 제거
    }

    function addTodo(text, date) {
      const trimmed = text.trim();
      if (trimmed === '') return;
      todos.unshift({ id: todoSeq++, text: trimmed, done: false, createdAt: Date.now(), date });
      saveTodos();
      renderTodos();
    }

    function editTodo(id, text, date) {
      const trimmed = text.trim();
      if (trimmed === '') return; // 빈 값이면 수정하지 않음
      const todo = todos.find(t => t.id === id);
      if (!todo) return;
      if (todo.text === trimmed && todo.date === date) return;
      todo.text = trimmed;
      todo.date = date;
      saveTodos();
      renderTodos();
    }

    function toggleTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.done = !todo.done;
        saveTodos();
        renderTodos();
      }
    }

    // "+ 할 일 추가" → 팝업 시트 열기
    addBtn.addEventListener('click', () => openTodoSheet());

    function submitTodo() {
      if (editingTodoId !== null) {
        editTodo(editingTodoId, todoInput.value, sheetDate);
      } else {
        addTodo(todoInput.value, sheetDate);
      }
      closeTodoSheet();
    }

    btnTodoAdd.addEventListener('click', submitTodo);
    document.getElementById('btnTodoCancel').addEventListener('click', closeTodoSheet);
    todoInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') submitTodo();
    });

    /* ---------- 할 일 달력 ---------- */
    const calSheet = document.getElementById('calSheet');
    const calTitle = document.getElementById('calTitle');
    const calGrid = document.getElementById('calGrid');
    const calWeekdays = document.getElementById('calWeekdays');
    const calModeName = document.getElementById('calModeName');

    // 오른쪽 위 화살표로 전환하는 표시 방식
    const CAL_MODES = ['완료 개수', '완료 비율'];
    let calModeIdx = 0;
    let calY = 0, calM = 0; // 보고 있는 달 (calM은 0~11)

    // 요일 머리글 (일~토)
    WEEKDAY_KO.forEach((w, i) => {
      const el = document.createElement('div');
      el.className = 'cal-weekday' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
      el.textContent = w;
      calWeekdays.appendChild(el);
    });

    // 그 날짜의 완료/전체 개수
    function statsFor(key) {
      let total = 0, done = 0;
      todos.forEach(t => {
        if (t.date !== key) return;
        total++;
        if (t.done) done++;
      });
      return { total, done };
    }

    function renderCal() {
      calTitle.textContent = calY + '년 ' + (calM + 1) + '월';
      calModeName.textContent = CAL_MODES[calModeIdx];
      calGrid.innerHTML = '';

      const today = todayKey();
      const first = new Date(calY, calM, 1);
      const offset = first.getDay(); // 일요일 시작

      // 6주(42칸) 고정 — 달마다 달력 높이가 바뀌지 않게
      for (let i = 0; i < 42; i++) {
        const d = new Date(calY, calM, 1 - offset + i);
        const key = dateKeyOf(d);
        const wd = d.getDay();
        const { total, done } = statsFor(key);

        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'cal-cell' +
          (d.getMonth() === calM ? '' : ' out') +
          (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '') +
          (key === today ? ' today' : '');
        cell.dataset.date = key;

        const num = document.createElement('div');
        num.className = 'cal-num';
        num.textContent = d.getDate();

        const sub = document.createElement('div');
        sub.className = 'cal-sub';

        if (calModeIdx === 0) {
          // 완료 개수 — 한 일이 많을수록 빨간 원이 진해진다
          if (done > 0) {
            const alpha = Math.min(0.12 + done * 0.14, 0.8);
            num.style.background = 'rgba(255, 59, 48, ' + alpha.toFixed(2) + ')';
            if (alpha >= 0.5) num.style.color = '#fff'; // 진한 배경 위에서는 흰 글자
          }
        } else if (total > 0) {
          // 완료 비율 — 2/3 형식
          sub.textContent = done + '/' + total;
        }

        cell.appendChild(num);
        cell.appendChild(sub);
        cell.addEventListener('click', () => focusDate(key));
        calGrid.appendChild(cell);
      }
    }

    // 달력에서 고른 날짜의 그룹으로 이동 (할 일이 없는 날은 닫기만)
    function focusDate(key) {
      closeCalSheet();
      const head = todoList.querySelector('.todo-group[data-date="' + key + '"]');
      if (!head) return;
      head.scrollIntoView({ behavior: 'smooth', block: 'start' });
      head.classList.add('flash');
      setTimeout(() => head.classList.remove('flash'), 1500);
    }

    function openCalSheet() {
      const now = new Date();
      calY = now.getFullYear();
      calM = now.getMonth();
      renderCal();
      lastSheetOpen = Date.now();
      backdrop.classList.add('open');
      calSheet.classList.add('open');
    }
    function closeCalSheet() {
      backdrop.classList.remove('open');
      calSheet.classList.remove('open');
    }

    function shiftMonth(delta) {
      const d = new Date(calY, calM + delta, 1);
      calY = d.getFullYear();
      calM = d.getMonth();
      renderCal();
    }
    function shiftMode(delta) {
      calModeIdx = (calModeIdx + delta + CAL_MODES.length) % CAL_MODES.length;
      renderCal();
    }

    document.getElementById('calBtn').addEventListener('click', openCalSheet);
    document.getElementById('calPrevMonth').addEventListener('click', () => shiftMonth(-1));
    document.getElementById('calNextMonth').addEventListener('click', () => shiftMonth(1));
    document.getElementById('calPrevMode').addEventListener('click', () => shiftMode(-1));
    document.getElementById('calNextMode').addEventListener('click', () => shiftMode(1));
    document.getElementById('btnCalClose').addEventListener('click', closeCalSheet);

    renderTodos();
  </script>
</body>
</html>
